name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          # A release may already exist for this tag, e.g. one created from the GitHub
          # UI. Attach the built assets to it rather than opening a second,
          # competing release for the same tag.
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" \
              main.js manifest.json styles.css \
              --clobber
          else
            gh release create "$tag" \
              --title="$tag" \
              --generate-notes \
              main.js manifest.json styles.css
          fi
